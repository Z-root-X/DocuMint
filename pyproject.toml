[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documint"
version = "2.0.0"
description = "Universal Document Generation and Automation Tool"
authors = [
  { name="Gemini", email="gemini@example.com" },
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.1.0",
    "python-docx>=0.8.11",
    "pywin32>=306; sys_platform == 'win32'",
    "openpyxl>=3.1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
documint = "documint.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
